[tool.poetry]
package-mode = false
name = "product-release-control-system"
version = "1.0.0"

[tool.poetry.dependencies]
python = "^3.12"

fastapi = "^0.115.0"
uvicorn = { version = "^0.32.0", extras = ["standard"] }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"

sqlalchemy = { version = "^2.0.35", extras = ["asyncio", "mypy"] }
asyncpg = "^0.30.0"
alembic = "^1.13.0"
greenlet = "^3.1.0"

celery = { version = "^5.4.0", extras = ["redis"] }
redis = "^5.2.0"

minio = "^7.2.9"
slowapi = "^0.1.10"
psycopg = {extras = ["binary"], version = "^3.3.6"}
flower = "^2.2.0"
openpyxl = "^3.1.5"
reportlab = "^5.0.1"
pandas = "^3.0.6"


[tool.poetry.group.dev.dependencies]
mypy = "^1.11.2"
ruff = "^0.16.9"
pre-commit = "^4.6.2"


[tool.poetry.group.test.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade (автоматически заменяет устаревший синтаксис)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "E501", "N818", "B008", "B904"]


[tool.ruff.lint.isort]
known-first-party = ["src"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
plugins = [
    "pydantic.mypy",
    "sqlalchemy.ext.mypy.plugin",
]
exclude = ["migrations/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
enable_incomplete_feature = "NewGenericSyntax"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["minio.*", "celery.*", "pandas.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
addopts = "-x --cov=app --cov-report=term-missing"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
